<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowClean" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c1a12"/>
      <stop offset="70%" stop-color="#140c08"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="stoneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stoneGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df7b35"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadowClean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlowClean)"/>

  <!-- Minimalist Japanese Architectural Balancing Monoliths (Clean Systems) -->
  <g filter="url(#shadowClean)" transform="translate(200, 200)">
    <!-- Base Plinth -->
    <rect x="-90" y="60" width="180" height="28" rx="8" fill="#451a03" stroke="#92400e" stroke-width="2"/>

    <!-- Pillar 1 (Left Bronze Column) -->
    <rect x="-60" y="-30" width="40" height="90" rx="8" fill="url(#stoneGrad1)" stroke="#fde68a" stroke-width="2"/>

    <!-- Pillar 2 (Right Espresso Column) -->
    <rect x="20" y="-10" width="40" height="70" rx="8" fill="url(#stoneGrad2)" stroke="#f97316" stroke-width="2"/>

    <!-- Floating Beam / Lintel -->
    <rect x="-80" y="-80" width="160" height="32" rx="10" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>

    <!-- Top Balancing Golden Sphere -->
    <circle cx="0" cy="-110" r="20" fill="#fef08a" stroke="#d97706" stroke-width="3"/>
    <circle cx="-5" cy="-115" r="5" fill="#ffffff"/>
  </g>
</svg>
