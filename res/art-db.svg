<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="60%" stop-color="#140b07"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </radialGradient>
    <linearGradient id="bronzeCyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df7b35"/>
      <stop offset="40%" stop-color="#9a4d1a"/>
      <stop offset="100%" stop-color="#3d1d0b"/>
    </linearGradient>
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#df7b35" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Architectural Database Stacks (3D Bronze & Amber Discs) -->
  <g filter="url(#soft3D)" transform="translate(100, 70)">
    <!-- Disc 3 (Bottom) -->
    <g transform="translate(0, 160)">
      <path d="M0,35 C0,15 45,0 100,0 C155,0 200,15 200,35 L200,65 C200,85 155,100 100,100 C45,100 0,85 0,65 Z" fill="url(#bronzeCyl)"/>
      <ellipse cx="100" cy="35" rx="100" ry="35" fill="#542b13" stroke="#df7b35" stroke-width="2"/>
    </g>

    <!-- Disc 2 (Middle) -->
    <g transform="translate(0, 80)">
      <path d="M0,35 C0,15 45,0 100,0 C155,0 200,15 200,35 L200,65 C200,85 155,100 100,100 C45,100 0,85 0,65 Z" fill="url(#bronzeCyl)"/>
      <ellipse cx="100" cy="35" rx="100" ry="35" fill="url(#amberCore)" opacity="0.85"/>
      <ellipse cx="100" cy="35" rx="90" ry="30" fill="#3d1d0b"/>
    </g>

    <!-- Disc 1 (Top) -->
    <g transform="translate(0, 0)">
      <path d="M0,35 C0,15 45,0 100,0 C155,0 200,15 200,35 L200,65 C200,85 155,100 100,100 C45,100 0,85 0,65 Z" fill="url(#bronzeCyl)"/>
      <ellipse cx="100" cy="35" rx="100" ry="35" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
      <ellipse cx="100" cy="35" rx="75" ry="24" fill="#241208"/>
      <!-- Relational Node Connector -->
      <circle cx="100" cy="35" r="14" fill="#df7b35"/>
      <circle cx="100" cy="35" r="7" fill="#ffffff"/>
    </g>
  </g>
</svg>
