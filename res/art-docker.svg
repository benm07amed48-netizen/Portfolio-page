<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowDocker" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241913"/>
      <stop offset="70%" stop-color="#120c08"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3124"/>
      <stop offset="50%" stop-color="#2c1a11"/>
      <stop offset="100%" stop-color="#190e08"/>
    </linearGradient>
    <linearGradient id="neonOrangeEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlowDocker)"/>

  <!-- 3D Isometric Shipping Container (Architectural Minimalist) -->
  <g filter="url(#boxShadow)" transform="translate(200, 200)">
    <!-- Top Face -->
    <polygon points="0,-85 120,-25 0,35 -120,-25" fill="#5c3c2b" stroke="url(#neonOrangeEdge)" stroke-width="2.5"/>
    <line x1="-80" y1="-45" x2="40" y2="15" stroke="#3d2315" stroke-width="2"/>
    <line x1="-40" y1="-65" x2="80" y2="-5" stroke="#3d2315" stroke-width="2"/>

    <!-- Left Face -->
    <polygon points="-120,-25 0,35 0,135 -120,75" fill="url(#containerGrad)" stroke="url(#neonOrangeEdge)" stroke-width="2.5"/>
    <!-- Vertical Grooves -->
    <line x1="-90" y1="0" x2="-90" y2="95" stroke="#1f110a" stroke-width="3"/>
    <line x1="-60" y1="15" x2="-60" y2="110" stroke="#1f110a" stroke-width="3"/>
    <line x1="-30" y1="25" x2="-30" y2="125" stroke="#1f110a" stroke-width="3"/>

    <!-- Right Face -->
    <polygon points="0,35 120,-25 120,75 0,135" fill="#1c1109" stroke="url(#neonOrangeEdge)" stroke-width="2.5"/>
    <line x1="30" y1="25" x2="30" y2="125" stroke="#0e0704" stroke-width="3"/>
    <line x1="60" y1="15" x2="60" y2="110" stroke="#0e0704" stroke-width="3"/>
    <line x1="90" y1="0" x2="90" y2="95" stroke="#0e0704" stroke-width="3"/>

    <!-- Glowing Core Accent -->
    <circle cx="0" cy="35" r="8" fill="#fb923c" filter="drop-shadow(0 0 10px #f97316)"/>
  </g>
</svg>
