<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowPy" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1c14"/>
      <stop offset="70%" stop-color="#140c08"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="bronzePyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bronzePyBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0b02"/>
    </linearGradient>
    <filter id="shadowPy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlowPy)"/>

  <!-- 3D Sculpted Bronze Python Interlocking Knot -->
  <g filter="url(#shadowPy)" transform="translate(200, 200) scale(1.1)">
    <!-- Top Head / Loop -->
    <path d="M-8,-85 C45,-85 65,-65 65,-25 L65,5 C65,25 45,35 25,35 L-25,35 L-25,5 C-25,-15 -5,-25 15,-25 L35,-25 C45,-25 45,-45 35,-55 C25,-65 5,-65 -8,-65 L-8,-85 Z" 
          fill="url(#bronzePyTop)" stroke="#fde68a" stroke-width="3"/>
    <circle cx="28" cy="-55" r="7" fill="#ffffff"/>

    <!-- Bottom Head / Loop -->
    <path d="M8,85 C-45,85 -65,65 -65,25 L-65,-5 C-65,-25 -45,-35 -25,-35 L25,-35 L25,-5 C25,15 5,25 -15,25 L-35,25 C-45,25 -45,45 -35,55 C-25,65 -5,65 8,65 L8,85 Z" 
          fill="url(#bronzePyBot)" stroke="#df7b35" stroke-width="3"/>
    <circle cx="-28" cy="55" r="7" fill="#fbbf24"/>
  </g>
</svg>
