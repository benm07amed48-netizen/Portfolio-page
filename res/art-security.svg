<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowSec" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2b1b13"/>
      <stop offset="70%" stop-color="#140b07"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="shieldGradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadowSec" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlowSec)"/>

  <!-- 3D Embossed Shield & Keyhole Vault (API Security) -->
  <g filter="url(#shadowSec)" transform="translate(200, 200)">
    <!-- Outer Shield Crest -->
    <path d="M0,-110 C65,-110 100,-75 100,0 C100,75 55,120 0,140 C-55,120 -100,75 -100,0 C-100,-75 -65,-110 0,-110 Z" 
          fill="url(#shieldGradSec)" stroke="#fef08a" stroke-width="4"/>

    <!-- Inner Recessed Core -->
    <path d="M0,-85 C50,-85 75,-55 75,0 C75,55 40,95 0,110 C-40,95 -75,55 -75,0 C-75,-55 -50,-85 0,-85 Z" 
          fill="#1c1009" stroke="#b45309" stroke-width="2"/>

    <!-- 3D Mechanical Keyhole -->
    <circle cx="0" cy="-10" r="22" fill="#d97706" stroke="#fde68a" stroke-width="2"/>
    <polygon points="-8,-10 8,-10 14,35 -14,35" fill="#d97706"/>
    <circle cx="0" cy="-10" r="10" fill="#0f0703"/>
    <polygon points="-4,-10 4,-10 6,28 -6,28" fill="#0f0703"/>
  </g>
</svg>
