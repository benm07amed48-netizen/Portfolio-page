<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studioBg3" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f3ede2"/>
      <stop offset="100%" stop-color="#e5dccf"/>
    </radialGradient>

    <linearGradient id="clayCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5eee3"/>
      <stop offset="100%" stop-color="#dacab8"/>
    </linearGradient>

    <linearGradient id="clayTerm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2214"/>
      <stop offset="50%" stop-color="#241208"/>
      <stop offset="100%" stop-color="#120703"/>
    </linearGradient>

    <linearGradient id="clayGold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="clayShadowBig3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#785338" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4a3120" flood-opacity="0.14"/>
    </filter>

    <filter id="clayShadowSmall3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#543722" flood-opacity="0.25"/>
    </filter>

    <filter id="clayGroundShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="100%" height="100%" fill="url(#studioBg3)" rx="28"/>

  <!-- Pedestal Floor Ground Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="32" fill="#8c6a50" opacity="0.28" filter="url(#clayGroundShadow3)"/>

  <!-- 3D Clay Cylindrical Plinth / Base -->
  <g transform="translate(140, 345)">
    <path d="M0,35 C0,15 70,0 160,0 C250,0 320,15 320,35 L320,60 C320,80 250,95 160,95 C70,95 0,80 0,60 Z" fill="#ede4d8"/>
    <ellipse cx="160" cy="35" rx="160" ry="35" fill="#f5ede3"/>
    <ellipse cx="160" cy="35" rx="145" ry="30" fill="#ede4d8"/>
  </g>

  <!-- 3D Puffy Clay Cloud & Terminal Stage (Floating) -->
  <g filter="url(#clayShadowBig3)" transform="translate(300, 190)">
    <!-- 3D Puffy Ivory Clay Cloud Cluster -->
    <g transform="translate(-15, 20)">
      <circle cx="-90" cy="10" r="65" fill="url(#clayCloud)"/>
      <circle cx="-30" cy="-45" r="75" fill="url(#clayCloud)"/>
      <circle cx="50" cy="-35" r="70" fill="url(#clayCloud)"/>
      <circle cx="100" cy="20" r="60" fill="url(#clayCloud)"/>
      <rect x="-90" y="5" width="190" height="70" rx="35" fill="url(#clayCloud)"/>
    </g>

    <!-- 3D Dark Espresso Floating Terminal Cube (Foreground) -->
    <g filter="url(#clayShadowSmall3)" transform="translate(25, -20)">
      <!-- Terminal Beveled Outer Box -->
      <rect x="-95" y="-75" width="190" height="135" rx="22" fill="url(#clayTerm)" stroke="url(#clayGold3)" stroke-width="3"/>

      <!-- Top Header Bar -->
      <rect x="-95" y="-75" width="190" height="32" rx="18" fill="#1c0c05"/>
      <circle cx="-75" cy="-59" r="5" fill="#ef4444"/>
      <circle cx="-60" cy="-59" r="5" fill="#f59e0b"/>
      <circle cx="-45" cy="-59" r="5" fill="#10b981"/>

      <!-- Terminal Body Content -->
      <text x="-75" y="-12" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#fb923c">&gt; repos: 50+</text>
      <text x="-75" y="16" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fef08a">✓ sync: 100%</text>
      <text x="-75" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#9ca3af">docker: active</text>
    </g>

    <!-- Floating 3D Golden Lightning Energy Bolt -->
    <g filter="url(#clayShadowSmall3)" transform="translate(-115, -45)">
      <polygon points="0,-40 18,-40 -5,0 20,0 -20,50 -5,12 -25,12" fill="url(#clayGold3)" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Floating Distinction Clay Beads -->
    <circle cx="130" cy="-70" r="14" fill="url(#clayGold3)" filter="url(#clayShadowSmall3)"/>
    <circle cx="-135" cy="55" r="12" fill="#ea580c" filter="url(#clayShadowSmall3)"/>
  </g>
</svg>
