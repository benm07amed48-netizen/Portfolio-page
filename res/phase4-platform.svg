<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studioBg4" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f3ede2"/>
      <stop offset="100%" stop-color="#e5dccf"/>
    </radialGradient>

    <linearGradient id="clayPhoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5eee3"/>
      <stop offset="100%" stop-color="#d4c3b0"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1a10"/>
      <stop offset="100%" stop-color="#140803"/>
    </linearGradient>

    <linearGradient id="chartBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="clayShadowBig4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#785338" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4a3120" flood-opacity="0.14"/>
    </filter>

    <filter id="clayShadowSmall4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#543722" flood-opacity="0.25"/>
    </filter>

    <filter id="clayGroundShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="100%" height="100%" fill="url(#studioBg4)" rx="28"/>

  <!-- Pedestal Floor Ground Shadow -->
  <ellipse cx="300" cy="410" rx="210" ry="32" fill="#8c6a50" opacity="0.28" filter="url(#clayGroundShadow4)"/>

  <!-- 3D Clay Cylindrical Plinth / Base -->
  <g transform="translate(140, 345)">
    <path d="M0,35 C0,15 70,0 160,0 C250,0 320,15 320,35 L320,60 C320,80 250,95 160,95 C70,95 0,80 0,60 Z" fill="#ede4d8"/>
    <ellipse cx="160" cy="35" rx="160" ry="35" fill="#f5ede3"/>
    <ellipse cx="160" cy="35" rx="145" ry="30" fill="#ede4d8"/>
  </g>

  <!-- 3D Soft Clay Smartphone Platform (Floating Studio Composition) -->
  <g filter="url(#clayShadowBig4)" transform="translate(300, 190)">
    <!-- Phone Outer Clay Shell -->
    <rect x="-95" y="-120" width="190" height="240" rx="36" fill="url(#clayPhoneBody)" stroke="#ede4d8" stroke-width="4"/>

    <!-- Screen Glass Inset -->
    <rect x="-82" y="-106" width="164" height="212" rx="26" fill="url(#screenGrad)"/>

    <!-- Dynamic Notch / Speaker -->
    <rect x="-24" y="-98" width="48" height="12" rx="6" fill="#0d0502"/>

    <!-- Platform Dashboard Header -->
    <rect x="-68" y="-76" width="70" height="14" rx="4" fill="#fb923c"/>
    <rect x="12" y="-76" width="56" height="14" rx="4" fill="#3d2214"/>

    <!-- Analytics Chart Graph -->
    <g transform="translate(-68, 15)">
      <!-- Grid Lines -->
      <line x1="0" y1="0" x2="136" y2="0" stroke="#3d2214" stroke-width="1.5"/>
      <line x1="0" y1="35" x2="136" y2="35" stroke="#3d2214" stroke-width="1.5"/>

      <!-- Vertical Chart Bars -->
      <rect x="10" y="-15" width="18" height="50" rx="6" fill="url(#chartBarGrad)"/>
      <rect x="40" y="-35" width="18" height="70" rx="6" fill="#f59e0b"/>
      <rect x="70" y="-20" width="18" height="55" rx="6" fill="url(#chartBarGrad)"/>
      <rect x="100" y="-45" width="18" height="80" rx="6" fill="#fef08a"/>
    </g>

    <!-- Floating 3D Gold App Icon / Badge -->
    <g filter="url(#clayShadowSmall4)" transform="translate(105, -50)">
      <circle cx="0" cy="0" r="26" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
      <polygon points="-6,-10 12,0 -6,10" fill="#ffffff"/>
    </g>

    <!-- Floating Distinction Clay Beads -->
    <circle cx="-115" cy="65" r="14" fill="#fb923c" filter="url(#clayShadowSmall4)"/>
    <circle cx="110" cy="85" r="10" fill="#fef08a" filter="url(#clayShadowSmall4)"/>
  </g>
</svg>
