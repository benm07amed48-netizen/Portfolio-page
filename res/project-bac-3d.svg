<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bacStudioBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="60%" stop-color="#140c07"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="tabletBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3022"/>
      <stop offset="50%" stop-color="#24140b"/>
      <stop offset="100%" stop-color="#140803"/>
    </linearGradient>
    <linearGradient id="amberGoldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow3DProj" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bacStudioBg)"/>

  <!-- 3D Studio Tablet Perspective Stage -->
  <g filter="url(#shadow3DProj)" transform="translate(85, 40)">
    <!-- Tablet Outer Casing -->
    <rect x="0" y="0" width="530" height="340" rx="28" fill="url(#tabletBezel)" stroke="#df7b35" stroke-width="2.5"/>

    <!-- Screen Bezel Inset -->
    <rect x="14" y="14" width="502" height="312" rx="20" fill="#0f0703"/>

    <!-- Web Platform Interface Layout -->
    <!-- Top Navigation Header -->
    <rect x="14" y="14" width="502" height="46" rx="18" fill="#1f1109"/>
    <circle cx="42" cy="37" r="12" fill="#df7b35"/>
    <text x="42" y="42" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">BAC</text>
    <rect x="68" y="32" width="130" height="10" rx="4" fill="#a89a8c"/>
    <rect x="380" y="28" width="110" height="18" rx="8" fill="#ea580c"/>
    <text x="435" y="41" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ENROLL NOW</text>

    <!-- Platform Hero Banner -->
    <rect x="32" y="76" width="466" height="110" rx="14" fill="#29150b" stroke="#3d2113" stroke-width="1.5"/>
    <text x="52" y="112" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#ffffff">The N°1 BAC Preparation Hub</text>
    <text x="52" y="138" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#d9cbbd">Comprehensive revision modules, exams archive &amp; real-time analytics.</text>
    <rect x="52" y="154" width="120" height="18" rx="6" fill="#f59e0b"/>
    <text x="112" y="167" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">START LEARNING</text>

    <!-- 3 Subject Module Cards -->
    <g transform="translate(32, 202)">
      <!-- Card 1: Math -->
      <rect x="0" y="0" width="146" height="108" rx="12" fill="#1f1109" stroke="#3d2113" stroke-width="1.5"/>
      <circle cx="30" cy="28" r="14" fill="#ea580c"/>
      <text x="30" y="34" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">∑</text>
      <text x="54" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#ffffff">Mathematics</text>
      <rect x="18" y="58" width="110" height="6" rx="3" fill="#3d2113"/>
      <rect x="18" y="58" width="85" height="6" rx="3" fill="#f59e0b"/>
      <text x="18" y="86" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">92% COMPLETED</text>

      <!-- Card 2: Physics -->
      <rect x="160" y="0" width="146" height="108" rx="12" fill="#1f1109" stroke="#3d2113" stroke-width="1.5"/>
      <circle cx="190" cy="28" r="14" fill="#d97706"/>
      <text x="190" y="34" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">⚡</text>
      <text x="214" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#ffffff">Physics</text>
      <rect x="178" y="58" width="110" height="6" rx="3" fill="#3d2113"/>
      <rect x="178" y="58" width="70" height="6" rx="3" fill="#fb923c"/>
      <text x="178" y="86" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fb923c">75% COMPLETED</text>

      <!-- Card 3: Science -->
      <rect x="320" y="0" width="146" height="108" rx="12" fill="#1f1109" stroke="#3d2113" stroke-width="1.5"/>
      <circle cx="350" cy="28" r="14" fill="#b45309"/>
      <text x="350" y="34" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">🔬</text>
      <text x="374" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#ffffff">Natural Sci</text>
      <rect x="338" y="58" width="110" height="6" rx="3" fill="#3d2113"/>
      <rect x="338" y="58" width="95" height="6" rx="3" fill="#34d399"/>
      <text x="338" y="86" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">98% COMPLETED</text>
    </g>

    <!-- Floating 3D Golden Badge (Top Right) -->
    <g transform="translate(480, -15)">
      <circle cx="0" cy="0" r="30" fill="url(#amberGoldRibbon)" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))"/>
      <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle">N°1</text>
    </g>
  </g>
</svg>
