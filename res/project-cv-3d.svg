<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cvStudioBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#261b14"/>
      <stop offset="60%" stop-color="#120c08"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="cvPaperFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="40%" stop-color="#f5eee3"/>
      <stop offset="100%" stop-color="#e3d6c5"/>
    </linearGradient>
    <linearGradient id="goldSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow3DCV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#df7b35" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#cvStudioBg)"/>

  <!-- 3D Studio Web CV Perspective Stage -->
  <g filter="url(#shadow3DCV)" transform="translate(115, 35)">
    <!-- Document Outer Sheet -->
    <rect x="0" y="0" width="470" height="350" rx="24" fill="url(#cvPaperFrame)" stroke="#df7b35" stroke-width="2.5"/>

    <!-- Document Header Area -->
    <g transform="translate(36, 32)">
      <!-- Avatar Badge -->
      <circle cx="28" cy="28" r="28" fill="#3d2315"/>
      <text x="28" y="36" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#df7b35" text-anchor="middle">MB</text>
      
      <!-- Name & Title -->
      <text x="70" y="24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#241208">Mohamed Benkhira</text>
      <text x="70" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8c6a50">Computer Science Engineer &bull; ENPO Maurice Audin</text>
    </g>

    <line x1="36" y1="105" x2="434" y2="105" stroke="#d5c4b1" stroke-width="1.5"/>

    <!-- Document 2-Column Grid -->
    <g transform="translate(36, 125)">
      <!-- Left Column: Experience & Credentials -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#df7b35">EDUCATION &amp; MILESTONES</text>
        
        <rect x="0" y="14" width="220" height="42" rx="8" fill="#ede4d8"/>
        <text x="12" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#241208">State CS Engineering Degree</text>
        <text x="12" y="48" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8c6a50">ENPO Oran &bull; 2024–2027</text>

        <rect x="0" y="66" width="220" height="42" rx="8" fill="#ede4d8"/>
        <text x="12" y="84" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#241208">Backend Developer Track</text>
        <text x="12" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8c6a50">Roadmap.sh &bull; 20+ Checkpoints</text>

        <rect x="0" y="118" width="220" height="42" rx="8" fill="#ede4d8"/>
        <text x="12" y="136" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#241208">Baccalaureate (High Honors)</text>
        <text x="12" y="152" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8c6a50">Exact Sciences &bull; Very Good Distinction</text>
      </g>

      <!-- Right Column: Tech Skills Stack -->
      <g transform="translate(245, 0)">
        <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#df7b35">CORE COMPETENCIES</text>
        
        <!-- Skill Progress Bars -->
        <g transform="translate(0, 16)">
          <text x="0" y="10" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#241208">Python 3 / OOP</text>
          <rect x="0" y="16" width="150" height="6" rx="3" fill="#d5c4b1"/>
          <rect x="0" y="16" width="140" height="6" rx="3" fill="#ea580c"/>

          <text x="0" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#241208">FastAPI &amp; REST APIs</text>
          <rect x="0" y="44" width="150" height="6" rx="3" fill="#d5c4b1"/>
          <rect x="0" y="44" width="135" height="6" rx="3" fill="#ea580c"/>

          <text x="0" y="66" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#241208">PostgreSQL &amp; Redis</text>
          <rect x="0" y="72" width="150" height="6" rx="3" fill="#d5c4b1"/>
          <rect x="0" y="72" width="128" height="6" rx="3" fill="#ea580c"/>

          <text x="0" y="94" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#241208">Docker &amp; Linux</text>
          <rect x="0" y="100" width="150" height="6" rx="3" fill="#d5c4b1"/>
          <rect x="0" y="100" width="120" height="6" rx="3" fill="#ea580c"/>
        </g>
      </g>
    </g>

    <!-- Floating 3D Golden Wax Seal (Bottom Right) -->
    <g transform="translate(420, 305)">
      <circle cx="0" cy="0" r="32" fill="url(#goldSealGrad)" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))"/>
      <polygon points="0,-18 5,-5 18,-5 8,4 12,18 0,9 -12,18 -8,4 -18,-5 -5,-5" fill="#ffffff"/>
    </g>
  </g>
</svg>
