<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <radialGradient id="storeStudioBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2c1a11"/>
      <stop offset="60%" stop-color="#140c07"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="storeCubeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3122"/>
      <stop offset="50%" stop-color="#24150c"/>
      <stop offset="100%" stop-color="#140803"/>
    </linearGradient>
    <linearGradient id="amberGlowStore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow3DStore" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#storeStudioBg)"/>

  <!-- 3D Studio Terminal Perspective Stage -->
  <g filter="url(#shadow3DStore)" transform="translate(85, 40)">
    <!-- Terminal Chassis -->
    <rect x="0" y="0" width="530" height="340" rx="28" fill="url(#storeCubeFrame)" stroke="url(#amberGlowStore)" stroke-width="2.5"/>

    <!-- Screen Bezel Inset -->
    <rect x="14" y="14" width="502" height="312" rx="20" fill="#0c0603"/>

    <!-- Terminal Header Bar -->
    <rect x="14" y="14" width="502" height="42" rx="18" fill="#1f1108"/>
    <circle cx="38" cy="35" r="6" fill="#ef4444"/>
    <circle cx="58" cy="35" r="6" fill="#f59e0b"/>
    <circle cx="78" cy="35" r="6" fill="#10b981"/>
    <text x="265" y="40" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#df7b35" text-anchor="middle">benm07amed48@enpo: ~/projects/store-engine-python</text>

    <!-- Terminal Content Area -->
    <g transform="translate(36, 80)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f59e0b">&gt; python3 main.py --env=production --db=sqlite_disk</text>
      
      <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a89a8c">[OK] Initialized Python POS Architecture (Classes: Store, Inventory, Ledger)</text>
      <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399">✓ [SYSTEM READY] 15,200 SKUs indexed into memory buffer</text>

      <!-- Tabular Invoicing ASCII Display -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="458" height="110" rx="8" fill="#180e07" stroke="#3d2112" stroke-width="1.5"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#fef08a">================ TRANSACTION INVOICE #89201 ===============</text>
        <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ffffff">ITEM                     QTY    UNIT PRICE     TOTAL</text>
        <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#d9cbbd">Python Backend License    02      $450.00     $900.00</text>
        <text x="14" y="86" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#d9cbbd">High-Concurrency API      01      $600.00     $600.00</text>
        <text x="14" y="102" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#34d399">NET PAYABLE: $1,500.00 [PAID &amp; COMMITTED TO DISK]</text>
      </g>

      <text x="0" y="210" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#fb923c">&gt; Ready for next transaction_</text>
    </g>

    <!-- Floating Python Core 3D Badge -->
    <g transform="translate(480, -15)">
      <circle cx="0" cy="0" r="30" fill="#180e07" stroke="#df7b35" stroke-width="2.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="900" fill="#f59e0b" text-anchor="middle">PY3</text>
    </g>
  </g>
</svg>
