<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="projStoreBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2c1a11"/>
      <stop offset="60%" stop-color="#140c07"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#df7b35"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="glowStore" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#projStoreBg)"/>

  <!-- 3D Studio Terminal Console -->
  <g filter="url(#glowStore)" transform="translate(60, 50)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="480" height="280" rx="20" fill="#180e09" stroke="url(#termBorder)" stroke-width="2.5"/>

    <!-- Title Bar -->
    <rect x="0" y="0" width="480" height="42" rx="18" fill="#24140c"/>
    <circle cx="28" cy="21" r="6" fill="#ef4444"/>
    <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="21" r="6" fill="#10b981"/>
    <text x="240" y="26" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#a89a8c" text-anchor="middle">store_engine.py &bull; [PYTHON 3 OOP]</text>

    <!-- Terminal Code / Transaction Table Content -->
    <g transform="translate(30, 80)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f59e0b">&gt;&gt;&gt; python3 -m store.pos --transaction-ledger</text>
      <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#d9cbbd">[INIT] Loading persistent disk ledger... OK (2,410 records)</text>
      <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#d9cbbd">[TX_8402] SKU: #CORE-API-PY | QTY: 12 | TOTAL: $1,440.00</text>
      <text x="0" y="88" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#34d399">✓ [STATUS: 200 OK] Invoicing synchronized with disk DB</text>
      <text x="0" y="120" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#fb923c">&gt; Ready for next command_</text>
    </g>

    <!-- Glowing Amber Corner Badge -->
    <g transform="translate(420, 230)">
      <circle cx="0" cy="0" r="22" fill="#df7b35" filter="drop-shadow(0 0 10px #f97316)"/>
      <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">CLI</text>
    </g>
  </g>
</svg>
