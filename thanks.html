<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 20px;
            text-align: center;
        }

        .thank-you-card {
            border: 2px solid #000;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #444;
            line-height: 1.5;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .home-btn:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <main class="thank-you-card">
        <h1>Message Sent! 🎉</h1>
        <p>Thank you for reaching out. Your message has been sent successfully, and I will get back to you soon.</p>
        <a href="index.html" class="home-btn">Back to Home</a>
    </main>

</body>

</html>
